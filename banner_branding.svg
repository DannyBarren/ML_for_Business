<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Subtle tech / stats background elements -->
  <g opacity="0.12" font-family="monospace" font-size="13" fill="#58a6ff">
    <text x="30" y="70">from sklearn.pipeline import Pipeline</text>
    <text x="30" y="100">model.fit(X, y)</text>
    <text x="30" y="130">feature_importances_</text>
    <text x="950" y="90">automation_rate: 87%</text>
    <text x="950" y="120">owner_hours_saved: 14/wk</text>
    <text x="950" y="150">pipeline = CustomAI(...)</text>
  </g>
  <g opacity="0.2" fill="#238636">
    <rect x="80" y="480" width="160" height="50" rx="6"/>
    <rect x="280" y="450" width="200" height="80" rx="6"/>
    <rect x="520" y="500" width="140" height="30" rx="6"/>
    <rect x="700" y="460" width="240" height="70" rx="6"/>
    <rect x="980" y="490" width="180" height="40" rx="6"/>
  </g>

  <!-- Main content -->
  <text x="640" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#8b949e">Danny Barren</text>
  <text x="640" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#58a6ff">AI/ML &amp; Automation Engineer</text>
  
  <text x="640" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc" filter="url(#glow)">Custom AI/ML &amp; Automation Engineering</text>
  <text x="640" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#c9d1d9">for SMBs and Solo Owner/Operators</text>
  
  <text x="640" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#7ee787">Automation for Professionals — work for your business, not on your business</text>
</svg>