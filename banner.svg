    <text x="900" y="200">top_features = ['revenue', 'tenure']</text>
  </g>
  <!-- Stats bars -->
  <g opacity="0.25" fill="#238636">
    <rect x="100" y="480" width="180" height="40" rx="4"/>
    <rect x="320" y="450" width="220" height="70" rx="4"/>
    <rect x="580" y="500" width="150" height="20" rx="4"/>
    <rect x="780" y="460" width="260" height="60" rx="4"/>
  </g>
  <!-- Title -->
  <text x="640" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f0f6fc" filter="url(#glow)">Machine Learning</text>
  <text x="640" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" fill="#58a6ff">for Business Insights</text>
  <text x="640" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8b949e">Plug-and-Play Code · Small &amp; Large Datasets · Actionable Insights</text>
</svg>