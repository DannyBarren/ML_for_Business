  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- Subtle code lines -->
  <g opacity="0.15" font-family="monospace" font-size="14" fill="#58a6ff">
    <text x="40" y="80">import pandas as pd</text>
    <text x="40" y="110">from sklearn.ensemble import RandomForestClassifier</text>
    <text x="40" y="140">pipeline = Pipeline([...])</text>
    <text x="40" y="170">grid_search.fit(X_train, y_train)</text>
    <text x="900" y="120">feature_importance_</text>
